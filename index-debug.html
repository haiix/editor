<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Haiix Editor(debug)</title>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "@haiix/idb": "./node_modules/@haiix/idb/dist/idb.mjs",
          "@haiix/tcomponent": "./node_modules/@haiix/tcomponent/TComponent.mjs",
          "@zip.js/zip.js": "./node_modules/@zip.js/zip.js/index.js",
          "monaco-editor/esm/vs/editor/editor.api.js": "./src/index-debug.importmap.mjs",
          "typescript": "./src/index-debug.importmap.mjs"
        }
      }
    </script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="./node_modules/monaco-editor/min/vs/loader.js"></script>
    <script type="module">
      require.config({ paths: { vs: './node_modules/monaco-editor/min/vs' } });
      require([
        'vs/editor/editor.main',
        './node_modules/typescript/lib/typescript.js',
      ], () => {
        import('./src/index.mjs').catch((error) => {
          document.body.textContent = error?.stack ?? error;
          throw error;
        });
      });
    </script>
  </body>
</html>
